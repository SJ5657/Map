<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>구글 맵 3D 캐릭터 탐험 - Babylon.js</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Babylon.js Engine and dependencies -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      user-select: none;
      background-color: #0f172a;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      outline: none;
    }
    /* Custom scrollbar for HUD panels */
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: rgba(15, 23, 42, 0.6);
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(59, 130, 246, 0.5);
      border-radius: 3px;
    }
  </style>
</head>
<body class="relative text-slate-100">

  <!-- 3D Canvas -->
  <canvas id="renderCanvas"></canvas>

  <!-- Game HUD Overlay -->
  <div id="hud" class="pointer-events-none absolute inset-0 flex flex-col justify-between p-4 sm:p-6 z-10">
    
    <!-- 상단 바: 위치 및 GPS 정보 -->
    <div class="flex flex-wrap items-start justify-between gap-4">
      
      <!-- GPS 위치 표시 패널 -->
      <div class="pointer-events-auto bg-slate-900/85 backdrop-blur-md border border-slate-700/60 rounded-2xl p-4 shadow-xl flex items-center gap-4 min-w-[260px]">
        <div class="w-10 h-10 rounded-xl bg-blue-500/20 border border-blue-400/30 flex items-center justify-center text-blue-400 shrink-0">
          <i data-lucide="map-pin" class="w-5 h-5"></i>
        </div>
        <div class="flex-1">
          <div class="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center justify-between">
            <span>시뮬레이션 GPS</span>
            <span class="inline-flex items-center gap-1 text-[10px] text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20">
              <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span> 실시간
            </span>
          </div>
          <div id="locationName" class="text-base font-bold text-white truncate">서울 강남구 청담역 (7호선)</div>
          <div class="text-xs font-mono text-blue-300 flex gap-3 mt-0.5">
            <span>위도: <span id="latVal">37.519200</span>°N</span>
            <span>경도: <span id="lngVal">127.053100</span>°E</span>
          </div>
        </div>
      </div>

      <!-- 위치 빠른 이동 버튼 -->
      <div class="pointer-events-auto flex items-center gap-2 bg-slate-900/85 backdrop-blur-md border border-slate-700/60 rounded-2xl p-2 shadow-xl">
        <span class="text-xs font-semibold px-3 text-slate-400 hidden md:inline">빠른 이동:</span>
        <button onclick="teleportTo('cheongdam')" class="px-3 py-1.5 text-xs font-medium rounded-xl bg-blue-600 hover:bg-blue-500 transition text-white border border-blue-400 shadow-md">청담역 (7호선)</button>
        <button onclick="teleportTo('gangnam')" class="px-3 py-1.5 text-xs font-medium rounded-xl bg-slate-800 hover:bg-blue-600 transition text-slate-200 hover:text-white border border-slate-700">강남역 (2호선)</button>
        <button onclick="teleportTo('shibuya')" class="px-3 py-1.5 text-xs font-medium rounded-xl bg-slate-800 hover:bg-blue-600 transition text-slate-200 hover:text-white border border-slate-700">도쿄 (시부야)</button>
        <button onclick="teleportTo('timesSquare')" class="px-3 py-1.5 text-xs font-medium rounded-xl bg-slate-800 hover:bg-blue-600 transition text-slate-200 hover:text-white border border-slate-700">뉴욕 (타임스퀘어)</button>
      </div>
    </div>

    <!-- 우측: 지도 컨트롤 & 테마 전환 -->
    <div class="pointer-events-auto absolute top-24 right-4 sm:right-6 flex flex-col gap-2">
      <button onclick="toggleMapStyle('light')" title="라이트 모드 지도" class="p-3 bg-slate-900/85 hover:bg-slate-800 backdrop-blur-md border border-slate-700/60 rounded-xl text-slate-200 hover:text-white transition shadow-lg flex items-center justify-center">
        <i data-lucide="map" class="w-5 h-5 text-blue-400"></i>
      </button>
      <button onclick="toggleMapStyle('dark')" title="다크 모드 지도" class="p-3 bg-slate-900/85 hover:bg-slate-800 backdrop-blur-md border border-slate-700/60 rounded-xl text-slate-200 hover:text-white transition shadow-lg flex items-center justify-center">
        <i data-lucide="moon" class="w-5 h-5 text-indigo-400"></i>
      </button>
      <button onclick="toggleMapStyle('satellite')" title="위성 스타일 지도" class="p-3 bg-slate-900/85 hover:bg-slate-800 backdrop-blur-md border border-slate-700/60 rounded-xl text-slate-200 hover:text-white transition shadow-lg flex items-center justify-center">
        <i data-lucide="layers" class="w-5 h-5 text-emerald-400"></i>
      </button>
      <button onclick="togglePOIMarkers()" title="3D 장소(POI) 마커 켜기/끄기" class="p-3 bg-slate-900/85 hover:bg-slate-800 backdrop-blur-md border border-slate-700/60 rounded-xl text-slate-200 hover:text-white transition shadow-lg flex items-center justify-center">
        <i data-lucide="map-pin" class="w-5 h-5 text-rose-400"></i>
      </button>
      <div class="h-px bg-slate-700/60 my-1"></div>
      <button onclick="resetCamera()" title="기본 시점(카메라) 초기화" class="p-3 bg-slate-900/85 hover:bg-slate-800 backdrop-blur-md border border-slate-700/60 rounded-xl text-slate-200 hover:text-white transition shadow-lg flex items-center justify-center">
        <i data-lucide="compass" class="w-5 h-5 text-amber-400"></i>
      </button>
    </div>

    <!-- 하단 바: 상태 수치 & 조작 가이드 -->
    <div class="flex flex-col sm:flex-row items-end sm:items-center justify-between gap-4">
      
      <!-- 조작키 가이드 -->
      <div class="pointer-events-auto bg-slate-900/85 backdrop-blur-md border border-slate-700/60 rounded-2xl p-4 shadow-xl flex items-center gap-4">
        <div class="grid grid-cols-3 gap-1 w-24 text-center text-xs font-mono">
          <div></div>
          <div class="bg-slate-800 border border-slate-600 rounded p-1 font-bold">W</div>
          <div></div>
          <div class="bg-slate-800 border border-slate-600 rounded p-1 font-bold">A</div>
          <div class="bg-slate-800 border border-slate-600 rounded p-1 font-bold">S</div>
          <div class="bg-slate-800 border border-slate-600 rounded p-1 font-bold">D</div>
        </div>
        <div class="text-xs text-slate-300">
          <div class="font-semibold text-white">캐릭터 이동</div>
          <div class="text-slate-400">WASD 또는 방향키</div>
          <div class="text-slate-400 mt-0.5">마우스 드래그: 시점 회전 및 각도 조절</div>
        </div>
      </div>

      <!-- 실시간 주행/계측 정보 -->
      <div class="pointer-events-auto bg-slate-900/85 backdrop-blur-md border border-slate-700/60 rounded-2xl px-5 py-3 shadow-xl flex items-center gap-6">
        <div>
          <div class="text-[10px] uppercase font-semibold text-slate-400">이동 속도</div>
          <div class="text-lg font-bold font-mono text-emerald-400"><span id="speedVal">0.0</span> <span class="text-xs text-slate-400 font-sans">km/h</span></div>
        </div>
        <div class="h-8 w-px bg-slate-700/60"></div>
        <div>
          <div class="text-[10px] uppercase font-semibold text-slate-400">진행 방위</div>
          <div class="text-lg font-bold font-mono text-amber-400"><span id="headingVal">0</span>° <span id="headingCompass" class="text-xs text-slate-400 font-sans">북</span></div>
        </div>
        <div class="h-8 w-px bg-slate-700/60"></div>
        <div>
          <div class="text-[10px] uppercase font-semibold text-slate-400">시점 틸트각</div>
          <div class="text-lg font-bold font-mono text-blue-400"><span id="tiltVal">60</span>°</div>
        </div>
      </div>

    </div>
  </div>

  <!-- Main Game Logic Script -->
  <script>
    // Initialize Lucide Icons
    lucide.createIcons();

    // 지도 중심 기준 좌표 (기본값: 서울 청담역)
    const LOCATIONS = {
      cheongdam: { name: "서울 강남구 청담역 (7호선)", lat: 37.519200, lng: 127.053100 },
      gangnam: { name: "서울 강남대로 (강남역)", lat: 37.497900, lng: 127.027600 },
      shibuya: { name: "도쿄 시부야 스크램블", lat: 35.659500, lng: 139.700400 },
      timesSquare: { name: "뉴욕 타임스퀘어", lat: 40.758000, lng: -73.985500 }
    };

    let currentLocation = { ...LOCATIONS.cheongdam };

    // Canvas & Babylon Engine Variables
    const canvas = document.getElementById("renderCanvas");
    let engine, scene, camera;
    let character, characterBody, headMesh, leftArm, rightArm, leftLeg, rightLeg;
    let ground, groundMaterial, mapDynamicTexture;
    let mapCanvas, mapContext;
    let mapStyle = 'light'; // 'light' | 'dark' | 'satellite'
    let guiTexture;
    const poi3DNodes = [];
    let showPOIs = true;

    // Movement & Animation States
    const inputMap = {};
    let isMoving = false;
    let currentSpeed = 0;
    const maxSpeed = 14;
    let targetRotationY = 0;
    let animTime = 0;

    // Geographic Conversions Constants (Simulated Lat/Lng to World Scale)
    const LAT_DEGREE_IN_METERS = 111000; 
    const METERS_PER_UNIT = 5;

    // Google Maps Exact Color Palette Constants
    const GMAP_COLORS = {
      subway7: "#747F00",   // Line 7 Olive Green
      subway2: "#2DB400",   // Line 2 Green
      subway9: "#BDB092",   // Line 9 Gold/Beige
      subwayShin: "#D4003B",// Shinbundang Red
      hospital: "#EA4335",  // Google Medical Red
      shopping: "#F29900",  // Google Shopping Orange
      food: "#E65100",      // Google Dining Deep Orange
      landmark: "#1A73E8",  // Google Blue
      park: "#137333",      // Google Forest Green
      transit: "#0070C0"    // Transit Icon Blue
    };

    // Enhanced Real Google Maps POI Data (Cheongdam Station Centric)
    const LOCATION_POIS = {
      cheongdam: [
        { name: "청담역 7호선", type: "subway", line: "7호선", color: GMAP_COLORS.subway7, x: 0, z: 0, icon: "🚇" },
        { name: "청담역 1번출구", type: "subway_exit", line: "7호선 1번", color: GMAP_COLORS.subway7, x: 18, z: 12, icon: "1️⃣" },
        { name: "청담역 7번출구", type: "subway_exit", line: "7호선 7번", color: GMAP_COLORS.subway7, x: -22, z: 15, icon: "7️⃣" },
        { name: "청담역 13번출구", type: "subway_exit", line: "7호선 13번", color: GMAP_COLORS.subway7, x: 28, z: -25, icon: "⑬" },
        { name: "청담 우리들병원", type: "hospital", color: GMAP_COLORS.hospital, x: -45, z: 35, icon: "🏥" },
        { name: "강남세브란스 청담검진센터", type: "hospital", color: GMAP_COLORS.hospital, x: -70, z: 60, icon: "🩺" },
        { name: "강남구청역 (7호선/수인분당)", type: "subway", line: "환승역", color: GMAP_COLORS.subway7, x: -90, z: 10, icon: "🚉" },
        { name: "청담동 명품거리", type: "store", color: GMAP_COLORS.shopping, x: 45, z: 65, icon: "🛍️" },
        { name: "SM ENTERTAINMENT HQ", type: "landmark", color: GMAP_COLORS.landmark, x: 65, z: -40, icon: "🏢" },
        { name: "청담공원", type: "park", color: GMAP_COLORS.park, x: -35, z: -55, icon: "🌳" },
        { name: "스타벅스 청담역점", type: "cafe", color: GMAP_COLORS.food, x: -15, z: 22, icon: "☕" },
        { name: "청담동 주민센터 버스정류장", type: "bus", color: GMAP_COLORS.transit, x: 35, z: 5, icon: "🚌" }
      ],
      gangnam: [
        { name: "강남역 2호선", type: "subway", line: "2호선", color: GMAP_COLORS.subway2, x: 0, z: 20, icon: "🚇" },
        { name: "강남역 신분당선", type: "subway", line: "신분당", color: GMAP_COLORS.subwayShin, x: 15, z: -25, icon: "🚇" },
        { name: "강남세브란스 협력병원", type: "hospital", color: GMAP_COLORS.hospital, x: -50, z: 45, icon: "🏥" },
        { name: "카카오프렌즈 강남플래그십", type: "store", color: GMAP_COLORS.shopping, x: -20, z: -10, icon: "🛍️" },
        { name: "스타벅스 강남대로점", type: "cafe", color: GMAP_COLORS.food, x: 35, z: 30, icon: "☕" }
      ],
      shibuya: [
        { name: "시부야역 (JR Yamanote)", type: "subway", line: "JY", color: "#80C242", x: -10, z: 10, icon: "🚉" },
        { name: "시부야 스크램블 교차로", type: "landmark", color: GMAP_COLORS.landmark, x: 10, z: -15, icon: "🚦" },
        { name: "시부야 적십자 종합병원", type: "hospital", color: GMAP_COLORS.hospital, x: -60, z: 50, icon: "🏥" },
        { name: "시부야 109 타워", type: "store", color: GMAP_COLORS.shopping, x: 40, z: 35, icon: "🏬" }
      ],
      timesSquare: [
        { name: "타임스퀘어 - 42번가역", type: "subway", line: "N Q R W", color: "#F59E0B", x: 0, z: 0, icon: "🚇" },
        { name: "마운트 시나이 응급센터", type: "hospital", color: GMAP_COLORS.hospital, x: -65, z: -35, icon: "🏥" },
        { name: "브로드웨이 극장가", type: "landmark", color: GMAP_COLORS.landmark, x: 30, z: 45, icon: "🎭" }
      ]
    };

    // --- PROCEDURAL GOOGLE MAPS 2D CANVASES & VECTOR LABELS ---
    function createMapCanvasTexture() {
      mapCanvas = document.createElement("canvas");
      mapCanvas.width = 2048;
      mapCanvas.height = 2048;
      mapContext = mapCanvas.getContext("2d");

      renderMapTexture();

      mapDynamicTexture = new BABYLON.DynamicTexture("mapDynamicTexture", mapCanvas, scene, true);
      return mapDynamicTexture;
    }

    function renderMapTexture() {
      if (!mapContext) return;
      const ctx = mapContext;
      const w = mapCanvas.width;
      const h = mapCanvas.height;

      // Authentic Google Maps Theme Palette
      const colors = {
        light: {
          bg: "#f8f9fa",         // Clean G-Map Light Neutral
          block: "#e9ecef",       // City Block Gray
          park: "#e6f4ea",        // Soft Green Park
          water: "#c6dafc",       // Google Map Water Blue
          roadMajor: "#fef08a",   // Major Arterial Yellow
          roadMinor: "#ffffff",   // Local Road White
          roadBorder: "#dadce0",  // Road Boundary Gray
          building: "#dee2e6",
          buildingStroke: "#ced4da"
        },
        dark: {
          bg: "#171717",
          block: "#262626",
          park: "#0f291e",
          water: "#1a365d",
          roadMajor: "#854d0e",
          roadMinor: "#3b3b3b",
          roadBorder: "#262626",
          building: "#404040",
          buildingStroke: "#525252"
        },
        satellite: {
          bg: "#1c2517",
          block: "#293623",
          park: "#14380c",
          water: "#0f283d",
          roadMajor: "#64748b",
          roadMinor: "#475569",
          roadBorder: "#0f172a",
          building: "#3f4d38",
          buildingStroke: "#52634a"
        }
      }[mapStyle];

      // 1. Base Background
      ctx.fillStyle = colors.bg;
      ctx.fillRect(0, 0, w, h);

      // 2. Water Body (Han River / Local Waters)
      ctx.fillStyle = colors.water;
      ctx.beginPath();
      ctx.moveTo(0, h * 0.15);
      ctx.bezierCurveTo(w * 0.3, h * 0.1, w * 0.5, h * 0.35, w, h * 0.22);
      ctx.lineTo(w, 0);
      ctx.lineTo(0, 0);
      ctx.closePath();
      ctx.fill();

      // Water Text Label (Google Sans Aesthetic)
      ctx.fillStyle = mapStyle === 'dark' ? "#60a5fa" : "#1a73e8";
      ctx.font = "bold 26px Roboto, 'Noto Sans KR', sans-serif";
      ctx.fillText("한강 (Han River)", w * 0.65, h * 0.12);

      // 3. Parks & Greenery (Cheongdam Park & Local Greenery)
      ctx.fillStyle = colors.park;
      ctx.beginPath();
      ctx.roundRect(w * 0.15, h * 0.62, w * 0.28, h * 0.26, 32);
      ctx.fill();
      ctx.fillStyle = mapStyle === 'dark' ? "#34d399" : "#137333";
      ctx.font = "600 24px 'Noto Sans KR', sans-serif";
      ctx.fillText("🌳 청담공원 (Cheongdam Park)", w * 0.17, h * 0.75);

      // 4. Urban Blocks & Buildings
      ctx.fillStyle = colors.block;
      const gridSize = 160;
      const margin = 24;

      for (let x = 80; x < w - 80; x += gridSize) {
        for (let y = 80; y < h - 80; y += gridSize) {
          if (y < h * 0.25 && x < w * 0.7) continue; // Keep River Area Clear

          ctx.beginPath();
          ctx.roundRect(x + margin / 2, y + margin / 2, gridSize - margin, gridSize - margin, 12);
          ctx.fill();

          ctx.fillStyle = colors.building;
          ctx.strokeStyle = colors.buildingStroke;
          ctx.lineWidth = 1.5;

          const bMargin = 12;
          const bw = (gridSize - margin - bMargin * 3) / 2;
          const bh = (gridSize - margin - bMargin * 3) / 2;

          for (let bx = 0; bx < 2; bx++) {
            for (let by = 0; by < 2; by++) {
              const rx = x + margin / 2 + bMargin + bx * (bw + bMargin);
              const ry = y + margin / 2 + bMargin + by * (bh + bMargin);
              
              ctx.beginPath();
              ctx.roundRect(rx, ry, bw, bh, 6);
              ctx.fill();
              ctx.stroke();
            }
          }
          ctx.fillStyle = colors.block;
        }
      }

      // 5. Google Maps Road Grid & Pedestrian Crosswalks
      ctx.strokeStyle = colors.roadMinor;
      ctx.lineWidth = 18;
      ctx.lineCap = "round";

      for (let x = 80; x < w; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, h);
        ctx.stroke();
      }
      for (let y = 80; y < h; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      // Major Avenues (Hakdong-ro & Yeongdong-daero)
      ctx.strokeStyle = colors.roadBorder;
      ctx.lineWidth = 36;
      ctx.beginPath();
      ctx.moveTo(0, h * 0.48);
      ctx.lineTo(w, h * 0.48);
      ctx.stroke();

      ctx.strokeStyle = colors.roadMajor;
      ctx.lineWidth = 28;
      ctx.beginPath();
      ctx.moveTo(0, h * 0.48);
      ctx.lineTo(w, h * 0.48);
      ctx.stroke();

      // Main Vertical Avenue (영동대로)
      ctx.strokeStyle = colors.roadBorder;
      ctx.lineWidth = 38;
      ctx.beginPath();
      ctx.moveTo(w * 0.52, 0);
      ctx.lineTo(w * 0.52, h);
      ctx.stroke();

      ctx.strokeStyle = colors.roadMajor;
      ctx.lineWidth = 30;
      ctx.beginPath();
      ctx.moveTo(w * 0.52, 0);
      ctx.lineTo(w * 0.52, h);
      ctx.stroke();

      // --- NEW: SUBWAY OVERLAY ROUTING LINES (Google Maps Official Subway Layer) ---
      // 7호선 (Subway Line 7 - Olive Green Line along Hakdong-ro)
      ctx.strokeStyle = GMAP_COLORS.subway7;
      ctx.lineWidth = 10;
      ctx.setLineDash([16, 8]); // Dashed Subway Track Effect
      ctx.beginPath();
      ctx.moveTo(0, h * 0.48 + 26);
      ctx.lineTo(w, h * 0.48 + 26);
      ctx.stroke();
      ctx.setLineDash([]); // Reset dash

      // Line 7 Metro Route Ribbon
      ctx.fillStyle = GMAP_COLORS.subway7;
      ctx.beginPath();
      ctx.roundRect(w * 0.08, h * 0.51, 140, 26, 6);
      ctx.fill();
      ctx.fillStyle = "#ffffff";
      ctx.font = "bold 13px 'Noto Sans KR', sans-serif";
      ctx.fillText("지하철 7호선", w * 0.09, h * 0.52 + 5);

      // --- NEW: CROSSWALKS & BUS STOP MARKINGS ---
      ctx.fillStyle = mapStyle === 'dark' ? "#64748b" : "#ffffff";
      for (let i = -40; i <= 40; i += 12) {
        ctx.fillRect(w * 0.52 + i - 4, h * 0.48 - 14, 8, 28);
      }

      // Road Name Labels (Google Maps Typography)
      ctx.fillStyle = mapStyle === 'dark' ? "#9ca3af" : "#5f6368";
      ctx.font = "500 22px 'Noto Sans KR', sans-serif";
      
      ctx.save();
      ctx.translate(w * 0.25, h * 0.45);
      ctx.fillText("학동로 (Hakdong-ro)", 0, 0);
      ctx.restore();

      ctx.save();
      ctx.translate(w * 0.54, h * 0.35);
      ctx.rotate(Math.PI / 2);
      ctx.fillText("영동대로 (Yeongdong-daero)", 0, 0);
      ctx.restore();

      // 6. Draw Google Maps Pin Icons & Labels on Ground
      const activePois = LOCATION_POIS[getActiveLocationKey()] || LOCATION_POIS.cheongdam;
      activePois.forEach(poi => {
        const texX = ((poi.x + 150) / 300) * w;
        const texY = ((150 - poi.z) / 300) * h;

        ctx.save();
        ctx.translate(texX, texY);

        // Render Metro Exit Pill vs Standard Google Pin
        if (poi.type === "subway_exit") {
          ctx.fillStyle = poi.color;
          ctx.beginPath();
          ctx.roundRect(-30, -14, 60, 28, 14);
          ctx.fill();

          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 12px 'Noto Sans KR', sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(poi.icon + " 출구", 0, 0);
        } else {
          // Standard Google Map Pin Shape (Teardrop shape)
          ctx.fillStyle = poi.color;
          ctx.shadowColor = "rgba(0, 0, 0, 0.25)";
          ctx.shadowBlur = 8;
          ctx.shadowOffsetY = 4;

          ctx.beginPath();
          ctx.arc(0, -14, 18, 0, Math.PI * 2);
          ctx.fill();
          
          // Pin Pointer Tip
          ctx.beginPath();
          ctx.moveTo(-10, -6);
          ctx.lineTo(0, 10);
          ctx.lineTo(10, -6);
          ctx.closePath();
          ctx.fill();

          ctx.shadowColor = "transparent";

          // White Icon Center
          ctx.fillStyle = "#ffffff";
          ctx.font = "bold 16px sans-serif";
          ctx.textAlign = "center";
          ctx.textBaseline = "middle";
          ctx.fillText(poi.icon, 0, -13);

          // Google Maps Badge Label below Pin
          ctx.fillStyle = mapStyle === 'dark' ? "rgba(30, 41, 59, 0.92)" : "rgba(255, 255, 255, 0.95)";
          ctx.beginPath();
          ctx.roundRect(-65, 14, 130, 26, 13);
          ctx.fill();
          ctx.strokeStyle = colors.roadBorder;
          ctx.lineWidth = 1;
          ctx.stroke();

          ctx.fillStyle = mapStyle === 'dark' ? "#f1f5f9" : "#202124";
          ctx.font = "600 13px 'Noto Sans KR', sans-serif";
          ctx.fillText(poi.name, 0, 27);
        }

        ctx.restore();
      });

      if (mapDynamicTexture) {
        mapDynamicTexture.update();
      }
    }

    // --- HELPER FUNCTION TO GET ACTIVE LOCATION KEY ---
    function getActiveLocationKey() {
      for (const key in LOCATIONS) {
        if (LOCATIONS[key].lat === currentLocation.lat && LOCATIONS[key].lng === currentLocation.lng) {
          return key;
        }
      }
      return 'cheongdam';
    }

    // --- 3D FLOATING POI BILLBOARD OVERLAYS (BABYLON GUI) ---
    function rebuild3DPOIMarkers() {
      // Clear existing GUI markers
      poi3DNodes.forEach(node => node.dispose());
      poi3DNodes.length = 0;

      if (!showPOIs || !guiTexture) return;

      const activePois = LOCATION_POIS[getActiveLocationKey()] || LOCATION_POIS.cheongdam;

      activePois.forEach(poi => {
        // Create 3D anchor container node
        const anchor = new BABYLON.TransformNode(`poi_anchor_${poi.name}`, scene);
        anchor.position = new BABYLON.Vector3(poi.x, 3.5, poi.z);

        // GUI Button/Container
        const container = new BABYLON.GUI.Rectangle();
        container.width = "180px";
        container.height = poi.type === "subway_exit" ? "32px" : "42px";
        container.cornerRadius = 20;
        container.color = poi.color;
        container.thickness = 2;
        container.background = mapStyle === 'dark' ? "rgba(15, 23, 42, 0.9)" : "rgba(255, 255, 255, 0.95)";
        container.shadowColor = "rgba(0,0,0,0.3)";
        container.shadowBlur = 8;
        container.shadowOffsetY = 4;

        const stack = new BABYLON.GUI.StackPanel();
        stack.isVertical = false;
        container.addControl(stack);

        const iconText = new BABYLON.GUI.TextBlock();
        iconText.text = poi.icon + " ";
        iconText.width = "30px";
        iconText.fontSize = 16;
        stack.addControl(iconText);

        const nameText = new BABYLON.GUI.TextBlock();
        nameText.text = poi.name;
        nameText.color = mapStyle === 'dark' ? "#f8fafc" : "#1e293b";
        nameText.fontSize = poi.type === "subway_exit" ? 12 : 13;
        nameText.fontWeight = "bold";
        nameText.textHorizontalAlignment = BABYLON.GUI.Control.HORIZONTAL_ALIGNMENT_LEFT;
        stack.addControl(nameText);

        guiTexture.addControl(container);
        container.linkWithMesh(anchor);
        container.linkOffsetY = -30;

        poi3DNodes.push(anchor);
        poi3DNodes.push(container);
      });
    }

    // --- CHARACTER CREATION (3D ROBOT CHIBI) ---
    function createCharacter() {
      character = new BABYLON.TransformNode("character", scene);

      // Materials
      const bodyMat = new BABYLON.StandardMaterial("charBodyMat", scene);
      bodyMat.diffuseColor = new BABYLON.Color3(0.1, 0.5, 0.9); // Google Blue Accent
      bodyMat.specularColor = new BABYLON.Color3(0.3, 0.3, 0.3);

      const jointMat = new BABYLON.StandardMaterial("charJointMat", scene);
      jointMat.diffuseColor = new BABYLON.Color3(0.2, 0.2, 0.25);

      const headMat = new BABYLON.StandardMaterial("charHeadMat", scene);
      headMat.diffuseColor = new BABYLON.Color3(0.95, 0.95, 0.98);

      const visorMat = new BABYLON.StandardMaterial("charVisorMat", scene);
      visorMat.diffuseColor = new BABYLON.Color3(0.1, 0.8, 0.4);
      visorMat.emissiveColor = new BABYLON.Color3(0.05, 0.4, 0.2);

      // Torso
      characterBody = BABYLON.MeshBuilder.CreateBox("torso", { width: 1.2, height: 1.5, depth: 0.9 }, scene);
      characterBody.position.y = 1.65;
      characterBody.material = bodyMat;
      characterBody.parent = character;

      // Head
      headMesh = BABYLON.MeshBuilder.CreateBox("head", { width: 1.3, height: 1.1, depth: 1.1 }, scene);
      headMesh.position.y = 1.45;
      headMesh.material = headMat;
      headMesh.parent = characterBody;

      // Visor
      const visor = BABYLON.MeshBuilder.CreateBox("visor", { width: 0.9, height: 0.35, depth: 0.2 }, scene);
      visor.position = new BABYLON.Vector3(0, 0.05, -0.52);
      visor.material = visorMat;
      visor.parent = headMesh;

      // Arms
      leftArm = BABYLON.MeshBuilder.CreateBox("leftArm", { width: 0.35, height: 1.1, depth: 0.35 }, scene);
      leftArm.position = new BABYLON.Vector3(-0.85, 0.1, 0);
      leftArm.material = jointMat;
      leftArm.parent = characterBody;

      rightArm = BABYLON.MeshBuilder.CreateBox("rightArm", { width: 0.35, height: 1.1, depth: 0.35 }, scene);
      rightArm.position = new BABYLON.Vector3(0.85, 0.1, 0);
      rightArm.material = jointMat;
      rightArm.parent = characterBody;

      // Legs
      leftLeg = BABYLON.MeshBuilder.CreateBox("leftLeg", { width: 0.4, height: 1.0, depth: 0.4 }, scene);
      leftLeg.position = new BABYLON.Vector3(-0.35, -0.75, 0);
      leftLeg.material = jointMat;
      leftLeg.parent = characterBody;

      rightLeg = BABYLON.MeshBuilder.CreateBox("rightLeg", { width: 0.4, height: 1.0, depth: 0.4 }, scene);
      rightLeg.position = new BABYLON.Vector3(0.35, -0.75, 0);
      rightLeg.material = jointMat;
      rightLeg.parent = characterBody;

      // Shadows
      const shadowGenerator = new BABYLON.ShadowGenerator(1024, scene.lights[0]);
      shadowGenerator.addShadowCaster(characterBody, true);
      shadowGenerator.useBlurExponentialShadowMap = true;
    }

    // --- MAIN SCENE INITIALIZATION ---
    function createScene() {
      scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.06, 0.09, 0.16, 1);

      // Tilted Isometric-Style Camera setup (Tilt ~60 deg)
      camera = new BABYLON.ArcRotateCamera("TiltedMapCamera", -Math.PI / 2, Math.PI / 3, 40, BABYLON.Vector3.Zero(), scene);
      camera.lowerBetaLimit = Math.PI / 6;  // Don't go completely overhead
      camera.upperBetaLimit = Math.PI / 2.5; // Cap tilt to keep 2D map readable in 3D
      camera.lowerRadiusLimit = 15;
      camera.upperRadiusLimit = 75;
      camera.attachControl(canvas, true);

      // Light Setup
      const dirLight = new BABYLON.DirectionalLight("dir01", new BABYLON.Vector3(-1, -2, -1), scene);
      dirLight.position = new BABYLON.Vector3(20, 40, 20);
      dirLight.intensity = 0.8;

      const hemiLight = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
      hemiLight.intensity = 0.6;

      // 3D Map Ground Plane
      ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 300, height: 300 }, scene);
      groundMaterial = new BABYLON.StandardMaterial("groundMat", scene);
      groundMaterial.diffuseTexture = createMapCanvasTexture();
      groundMaterial.specularColor = new BABYLON.Color3(0, 0, 0);
      ground.material = groundMaterial;

      // 2D GUI for Floating Billboards
      guiTexture = BABYLON.GUI.AdvancedDynamicTexture.CreateFullscreenUI("UI");

      // Spawn Character & Initial POIs
      createCharacter();
      rebuild3DPOIMarkers();

      // Input Event Listeners
      scene.onKeyboardObservable.add((kbInfo) => {
        const evt = kbInfo.event;
        if (kbInfo.type === BABYLON.KeyboardEventTypes.KEYDOWN) {
          inputMap[evt.key.toLowerCase()] = true;
          inputMap[evt.code] = true;
        } else if (kbInfo.type === BABYLON.KeyboardEventTypes.KEYUP) {
          inputMap[evt.key.toLowerCase()] = false;
          inputMap[evt.code] = false;
        }
      });

      // Render Loop & Updates
      scene.registerBeforeRender(() => {
        updateCharacterMovement();
        updateCameraFollow();
        updateTelemetryHUD();
      });

      return scene;
    }

    // --- CHARACTER MOVEMENT & ANIMATION LOGIC ---
    function updateCharacterMovement() {
      let moveX = 0;
      let moveZ = 0;

      if (inputMap["w"] || inputMap["ArrowUp"]) moveZ += 1;
      if (inputMap["s"] || inputMap["ArrowDown"]) moveZ -= 1;
      if (inputMap["a"] || inputMap["ArrowLeft"]) moveX -= 1;
      if (inputMap["d"] || inputMap["ArrowRight"]) moveX += 1;

      isMoving = moveX !== 0 || moveZ !== 0;

      if (isMoving) {
        // Calculate input vector relative to camera rotation
        const angle = Math.atan2(moveX, moveZ);
        const cameraAngle = camera.alpha + Math.PI / 2;
        targetRotationY = cameraAngle + angle;

        // Smooth rotation interpolation
        let rotDiff = targetRotationY - character.rotation.y;
        while (rotDiff > Math.PI) rotDiff -= Math.PI * 2;
        while (rotDiff < -Math.PI) rotDiff += Math.PI * 2;
        character.rotation.y += rotDiff * 0.18;

        // Velocity & Position
        currentSpeed = Math.min(currentSpeed + 0.5, maxSpeed);
        const delta = engine.getDeltaTime() / 1000;
        const speedUnits = (currentSpeed * METERS_PER_UNIT) * delta * 0.08;

        character.position.x += Math.sin(character.rotation.y) * speedUnits;
        character.position.z += Math.cos(character.rotation.y) * speedUnits;

        // Bound to ground map edge
        character.position.x = Math.max(-140, Math.min(140, character.position.x));
        character.position.z = Math.max(-140, Math.min(140, character.position.z));

        // Walking limb animation
        animTime += delta * currentSpeed * 0.8;
        leftArm.rotation.x = Math.sin(animTime) * 0.6;
        rightArm.rotation.x = -Math.sin(animTime) * 0.6;
        leftLeg.rotation.x = -Math.sin(animTime) * 0.7;
        rightLeg.rotation.x = Math.sin(animTime) * 0.7;
        characterBody.position.y = 1.65 + Math.abs(Math.sin(animTime * 2)) * 0.08;
      } else {
        currentSpeed = Math.max(currentSpeed - 0.8, 0);
        leftArm.rotation.x *= 0.8;
        rightArm.rotation.x *= 0.8;
        leftLeg.rotation.x *= 0.8;
        rightLeg.rotation.x *= 0.8;
        characterBody.position.y = 1.65;
      }
    }

    // Smoothly track camera to character
    function updateCameraFollow() {
      if (!camera || !character) return;
      const targetPos = character.position.clone();
      targetPos.y += 1.0;
      BABYLON.Vector3.LerpToRef(camera.target, targetPos, 0.1, camera.target);
    }

    // Real-time HUD Telemetry
    function updateTelemetryHUD() {
      if (!character) return;

      // Simulated Lat / Lng relative to map position
      const latOffset = (character.position.z * METERS_PER_UNIT) / LAT_DEGREE_IN_METERS;
      const lngOffset = (character.position.x * METERS_PER_UNIT) / (LAT_DEGREE_IN_METERS * Math.cos(currentLocation.lat * Math.PI / 180));

      const currentLat = (currentLocation.lat + latOffset).toFixed(6);
      const currentLng = (currentLocation.lng + lngOffset).toFixed(6);

      document.getElementById("latVal").innerText = currentLat;
      document.getElementById("lngVal").innerText = currentLng;
      document.getElementById("speedVal").innerText = (currentSpeed * 1.2).toFixed(1);

      // Heading Compass calculation
      let headingDeg = Math.round((character.rotation.y * 180 / Math.PI) % 360);
      if (headingDeg < 0) headingDeg += 360;
      document.getElementById("headingVal").innerText = headingDeg;

      const directions = ["N", "NE", "E", "SE", "S", "SW", "W", "NW"];
      const dirIndex = Math.round(headingDeg / 45) % 8;
      document.getElementById("headingCompass").innerText = directions[dirIndex];

      // Tilt angle display
      const tiltDeg = Math.round((camera.beta * 180) / Math.PI);
      document.getElementById("tiltVal").innerText = tiltDeg;
    }

    // --- GLOBAL INTERACTION FUNCTIONS (EXPORTED TO WINDOW) ---
    window.teleportTo = function(locKey) {
      if (!LOCATIONS[locKey]) return;
      currentLocation = { ...LOCATIONS[locKey] };
      document.getElementById("locationName").innerText = currentLocation.name;
      
      // Reset character position to center of map
      if (character) {
        character.position = new BABYLON.Vector3(0, 0, 0);
      }
      
      renderMapTexture();
      rebuild3DPOIMarkers();
    };

    window.toggleMapStyle = function(style) {
      mapStyle = style;
      renderMapTexture();
      rebuild3DPOIMarkers();
    };

    window.togglePOIMarkers = function() {
      showPOIs = !showPOIs;
      rebuild3DPOIMarkers();
    };

    window.resetCamera = function() {
      if (!camera) return;
      camera.alpha = -Math.PI / 2;
      camera.beta = Math.PI / 3;
      camera.radius = 40;
    };

    // Initialize Engine & Application Window Handling
    window.addEventListener("DOMContentLoaded", () => {
      engine = new BABYLON.Engine(canvas, true);
      createScene();

      engine.runRenderLoop(() => {
        if (scene) scene.render();
      });

      window.addEventListener("resize", () => {
        engine.resize();
      });
    });
  </script>
